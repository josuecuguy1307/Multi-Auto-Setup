[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envrec"
version = "0.1.0"
description = "Environment recognition harness: probes return typed facts, the model picks from a closed menu."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "psutil>=5.9",
    "pytest>=8",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Discovery adapters import these lazily and report `unavailable` with the reason when they are missing.
discovery = ["bleak>=0.22", "pyserial>=3.5", "zeroconf>=0.130"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: needs a running local model; skipped when absent",
    "realdata: needs a downloaded public data file; skipped when absent",
]
