[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envrec"
version = "0.1.0"
description = "Environment recognition harness: probes return typed facts, the model picks from a closed menu."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "psutil>=5.9",
    "pytest>=8",
    "pyyaml>=6",
    "httpx>=0.27",
    # the network layer (docs/NETWORK_CONTRACT.md). `cryptography` has no wheel for macOS Intel since 49 and none for Windows arm64 since 46.0.3, so those two platforms get the
    # newest release that has one (older releases have published advisories); every other platform gets the current series.
    "cryptography>=50,<51; (sys_platform != 'darwin' or platform_machine != 'x86_64') and (sys_platform != 'win32' or platform_machine != 'ARM64')",
    "cryptography>=48,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography>=46,<47; sys_platform == 'win32' and platform_machine == 'ARM64'",
    "spake2>=0.9,<1",
]

[project.optional-dependencies]
# Discovery adapters import these lazily and report `unavailable` with the reason when they are missing.
discovery = ["bleak>=0.22", "pyserial>=3.5", "zeroconf>=0.130"]

[project.scripts]
mas = "envrec_mas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
envrec_coordinator = ["web_static/*"]  # the owner's screen: plain HTML, CSS, JS and the strings file, served from memory by the coordinator

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "testplugins"]
addopts = "-p envrec_timeout"  # a hard limit per test (120 s; ENVREC_TEST_TIMEOUT or @pytest.mark.timeout(n)): a hang is a failure, not a suite that never ends
markers = [
    "live: needs a running local model or the claude CLI; skipped when absent",
    "realdata: needs a downloaded public data file; skipped when absent",
]
