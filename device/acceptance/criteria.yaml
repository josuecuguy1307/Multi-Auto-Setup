# Acceptance criteria for the MAS portable device. Source of truth for ACCEPTANCE.md and test-results.json.
#
# Rules (enforced by scripts/device_accept.py, not by anyone's word):
# - Every criterion starts FAIL. Only the checker writes PASS, and only when every listed test ran and passed.
# - A skipped, missing or uncollectable test is FAIL. "No tests" is FAIL.
# - A PASS is bound to the content hash of `covers` (and the tests). Change a covered file and the PASS goes STALE until re-run.
# - `label` is how the result may be described in the README and the paper (EMULATED, SIMULATED, REAL, DESIGN-ONLY).
#
# Fields: id, phase, title, tests (pytest paths or node ids, relative to the repo root), covers (files or folders), label.

criteria:
  # ---- Phase 1: recon, decisions, harness -------------------------------------------------
  - id: P1-HARNESS
    phase: 1
    title: The acceptance checker treats skip/missing as FAIL and detects stale PASS; continuity files exist
    tests: [device/tests/test_harness.py]
    covers: [scripts/device_accept.py, device/acceptance/criteria.yaml, CLAUDE.md, .claude/settings.json, .claude/agents]
    label: REAL
    min_tests: 42
  - id: P1-DOCS
    phase: 1
    title: DECISIONS.md has architecture, threat model, guardrail spec, PCB spec and recorded advisor/reviewer advice
    tests: [device/tests/test_docs.py]
    covers: [DECISIONS.md, ACCEPTANCE.md, THIRD_PARTY.md]
    label: REAL
  - id: P1-UNIT
    phase: 1
    title: "First unit through the full cycle: signed approval tokens (guardrail 3) with an evaluator report"
    tests: [device/tests/test_approval.py, device/tests/test_unit_cycle.py]
    covers: [src/mas_device/approval.py, src/mas_device/keymodel.py, device/evals/evaluator]
    label: SIMULATED
    min_tests: 100
    saboteurs:
      - {name: skip-signature-check, file: src/mas_device/approval.py, old: "            pub.verify(sig, body_bytes)", new: "            pass"}
      - {name: keep-nonce-after-use, file: src/mas_device/approval.py, old: "            del self._pending[p.nonce]\n            self._last_counter", new: "            self._last_counter"}
      - {name: skip-summary-check, file: src/mas_device/approval.py, old: "if not (b.req.summary == p.summary == summary_for(action, p.cls)) or b.req.press_window_s != p.press_window_s:", new: "if False:"}
      - {name: skip-ttl-check, file: src/mas_device/approval.py, old: "            if not self._live(p, self._now()):", new: "            if False:"}

  # ---- Phase 2: software v0 -----------------------------------------------------------------
  - id: P2-GATE
    phase: 2
    title: Policy gate runs writes only with a valid single-use token bound to the exact action; undo recorded first
    tests: [device/tests/test_gate.py]
    covers: [src/mas_device]
    label: SIMULATED
    min_tests: 62
    saboteurs:
      - {name: skip-validate-in-run, file: src/mas_device/gate.py, old: "            self._validate_write(action)          # stale or forged: refused before the token is touched", new: "            pass"}
      - {name: skip-post-consume-recheck, file: src/mas_device/gate.py, old: "            self._check_state(action)                 # again, after the token is spent", new: "            pass"}
  - id: P2-LOG
    phase: 2
    title: Append-only hash-chained log; any edit, rewrite, truncation or reorder is detected against a known head; a broken log is never extended (process separation from the model is P2-GUARDRAILS)
    tests: [device/tests/test_log.py]
    covers: [src/mas_device]
    label: SIMULATED
    min_tests: 41
    saboteurs:
      - {name: skip-known-head-hash, file: src/mas_device/log.py, old: "        if hashes[expected.seq] != expected.hash:", new: "        if False:"}
      - {name: skip-byte-exact-line, file: src/mas_device/log.py, old: " and _line(rec) == raw + b\"\\n\":", new: ":"}
  - id: P2-GUARDRAILS
    phase: 2
    title: Scripted guardrail battery (all ten rules of MISSION 4.1) gives zero violations
    tests: [device/tests/test_guardrails.py]
    covers: [src/mas_device]
    label: SIMULATED
    min_tests: 36
    saboteurs:
      - {name: read-credentials, file: src/mas_device/gated.py, old: "    if is_credential_path(v):", new: "    if False:"}
      - {name: unlogged-refusals, file: src/mas_device/gated.py, old: "            self.log.append(\"rpc.refused\", {\"id\": rid, \"method\": method, \"code\": code})", new: "            pass"}
      - {name: extra-params-ignored, file: src/mas_device/gated.py, old: "    if set(params) != set(keys):", new: "    if not set(keys) <= set(params):"}
      - {name: log-inside-root, file: src/mas_device/gated.py, old: "    if _inside(state, root) or _inside(root, state):", new: "    if False:"}
      - {name: method-allowlist-bypass, file: src/mas_device/gated.py, old: "            if method not in ALLOWED:", new: "            if method not in ALLOWED and not hasattr(self, method):"}
      - {name: credential-actions-unchecked, file: src/mas_device/gated.py, old: "    if isinstance(action, dict):", new: "    if False:"}
  - id: P2-PORTABLE
    phase: 2
    title: One-command launch from a read-only medium in a clean VM/container; profiler picks compute mode
    tests: [device/tests/test_portable.py]
    covers: [src/mas_device, src/mas_fleet, device/medium]
    label: EMULATED
    min_tests: 10
    saboteurs:
      - {name: bytecode-written, file: device/medium/launch.sh, old: ' -I -B "$HERE', new: ' -I "$HERE'}
      - {name: manifest-unchecked, file: device/medium/launch.py, old: '    problems = medium.verify(MEDIUM)', new: '    problems = []'}
      - {name: cgroup-memory-ignored, file: src/mas_device/profiler.py, old: '            mem = min(mem, int(v))', new: '            pass'}
      - {name: cpu-quota-ignored, file: src/mas_device/profiler.py, old: '        cpus = min(cpus, max(1, -(-quota // period)))', new: '        pass'}
      - {name: pruning-off, file: device/medium/mas_medium_build.py, old: '    return not rel.startswith(PRUNE)', new: '    return True'}
  - id: P2-ZEROTRACE
    phase: 2
    title: Nothing installed after unplug (no service, driver, autostart, PATH change or file outside the declared temp dir); OS residue only from the enumerated allowlist (D-010 three-arm diff)
    thresholds: {residue_allowlist: device/acceptance/residue_allowlist.yaml}
    tests: [device/tests/test_zerotrace.py]
    covers: [src/mas_device, src/mas_fleet, device/medium, device/acceptance/residue_allowlist.yaml]
    label: EMULATED
    min_tests: 8
    saboteurs:
      - {name: allowlist-widened, file: device/acceptance/residue_allowlist.yaml, old: "    classes: []", new: "    classes: [{name: anything, paths: ['/*']}]"}
      - {name: undo-leaves-folders, file: src/mas_device/gate.py, old: "    os.rmdir(path)", new: "    pass"}
      - {name: temp-file-left, file: src/mas_device/gate.py, old: "        os.replace(tmp, path)", new: "        path.write_bytes(data)"}
      - {name: launcher-cache-dir, file: device/medium/launch.sh, old: 'exec "$HERE/runtime', new: 'mkdir -p "$HOME/.cache/mas" && exec "$HERE/runtime'}
      - {name: path-change, file: device/medium/launch.py, old: '    probe = profiler.probe()', new: '    probe = profiler.probe(); open(os.path.expanduser("~/.profile"), "a").write("export PATH=/media/mas:$PATH\n")'}
  - id: P2-FLEET
    phase: 2
    title: Pairing, per-write approval, auto-setup and undo between two or more isolated VMs/containers
    tests: [device/tests/test_fleet.py]
    covers: [src/mas_device, src/mas_fleet, device/medium]
    label: EMULATED
    min_tests: 11
    saboteurs:
      - {name: owner-confirm-skipped, file: src/mas_fleet/node.py, old: '    if _in("owner") != expected:', new: '    if _in("owner") is None:'}
      - {name: coordinator-owner-unchecked, file: src/mas_fleet/coordinator.py, old: '            if msg["owner_typed"] != f"JOIN {self.fleet}":', new: '            if False:'}
      - {name: plan-paths-unconfined, file: src/mas_fleet/plan.py, old: '    if len(parts) < 2 or parts[0] != ROOT_DIR:', new: '    if False:'}
      - {name: plan-hash-unchecked, file: src/mas_fleet/coordinator.py, old: '            if msg["plan_hash"] != self.plan_hash:', new: '            if False:'}
      - {name: leave-without-undo, file: src/mas_fleet/node.py, old: '    for ah in reversed(done):', new: '    for ah in []:'}

  # ---- Phase 3: inspection ------------------------------------------------------------------
  - id: P3-INSPECT
    phase: 3
    title: Inventory precision and recall against fixtures with known truth meet thresholds
    tests: [device/tests/test_inspect_accuracy.py]
    covers: [src/mas_device]
    label: SIMULATED
  - id: P3-READONLY
    phase: 3
    title: Inspection makes zero writes (diff and read-only mount) and never touches the network
    tests: [device/tests/test_inspect_readonly.py]
    covers: [src/mas_device, src/mas_fleet, device/medium, device/tests/mas_dockerkit.py]
    label: EMULATED

  # ---- Phase 4: key firmware ----------------------------------------------------------------
  - id: P4-FW-HOST
    phase: 4
    title: Firmware core (host build, HAL mocks) rejects replayed, altered and expired approvals; signs only after a press
    tests: [device/tests/test_firmware_host.py]
    covers: [device/firmware]
    label: SIMULATED
    min_tests: 323
  - id: P4-FW-EMU
    phase: 4
    title: Same firmware runs in QEMU (mps2-an505, Cortex-M33) with transcripts identical to the host build; button is the only approval path
    tests: [device/tests/test_firmware_emu.py]
    covers: [device/firmware]
    label: EMULATED
    min_tests: 27
  - id: P4-FW-RENODE
    phase: 4
    title: Same firmware runs in Renode with transcripts identical to the host build and QEMU
    tests: [device/tests/test_firmware_renode.py]
    covers: [device/firmware]
    label: EMULATED
    min_tests: 4

  # ---- Phase 5: hardware --------------------------------------------------------------------
  - id: P5-PCB
    phase: 5
    title: ERC, DRC and fabrication checks green; fab outputs marked NO FABRICAR; HUMAN_REVIEW_PCB.md present
    tests: [device/tests/test_pcb.py]
    covers: [device/hardware]
    label: DESIGN-ONLY
    min_tests: 20
    timeout_s: 2400

  # ---- Phase 6: evals and paper -------------------------------------------------------------
  - id: P6-EVALS
    phase: 6
    title: Evals reproducible with one command; every number in the paper comes from a script over raw results
    tests: [device/tests/test_evals_paper.py]
    covers: [device/evals, device/paper]
    label: REAL
  - id: P6-REPO
    phase: 6
    title: README, THIRD_PARTY.md and reproduction instructions complete
    tests: [device/tests/test_repo.py]
    covers: [README.md, THIRD_PARTY.md, device]
    label: REAL
    min_tests: 8
    saboteurs:
      - {name: criterion-missing-from-readme, file: device/README.md, old: "| P2-GATE | SIMULATED |", new: "| P2-XATE | SIMULATED |"}

  # ---- added after reviewer R-1 M6 (2026-11-17): every MISSION section 2/7 item has a criterion; numbers pinned before any run ----
  - id: P0-SECRETS
    phase: 1
    title: No credentials, keys or tokens anywhere in the repository (secret scan over the whole tree and history)
    tests: [device/tests/test_secrets.py]
    covers: [.]
    label: REAL
    min_tests: 17
  - id: P2-MODEL
    phase: 2
    title: The local model answers from the read-only medium with nothing installed on the host
    tests: [device/tests/test_model_portable.py]
    covers: [src/mas_device, device/medium]
    label: EMULATED
  - id: P2-MEMORY
    phase: 2
    title: Portable memory in an open format round-trips and is encrypted at rest
    tests: [device/tests/test_memory.py]
    covers: [src/mas_device]
    label: SIMULATED
    min_tests: 11
    saboteurs:
      - {name: checksum-unchecked, file: src/mas_device/memory.py, old: '        if hashlib.sha256(files[p]).hexdigest() != digest:', new: '        if False:'}
      - {name: fixed-salt-nonce, file: src/mas_device/memory.py, old: '    salt, nonce = secrets.token_bytes(SALT_LEN), secrets.token_bytes(NONCE_LEN)', new: '    salt, nonce = bytes(SALT_LEN), bytes(NONCE_LEN)'}
      - {name: kdf-floor-unchecked, file: src/mas_device/memory.py, old: '    if log2_n not in _LOG2_N_RANGE or r not in _R_RANGE or p not in _P_RANGE:', new: '    if False:'}
      - {name: secret-values-allowed, file: src/mas_device/memory.py, old: '            if kind == "secretRef" and _SECRET_FIELDS & {k.casefold() for k in rec if isinstance(k, str)}:', new: '            if False:'}
      - {name: temp-left-on-failure, file: src/mas_device/memory.py, old: '                os.remove(tmp)', new: '                pass'}
  - id: P2-PAIRING
    phase: 2
    title: The gate accepts only the paired key_id; MAS chat_choice approvals are absent from the device build; the host owner's launch is the session consent (D-021)
    tests: [device/tests/test_pairing.py]
    covers: [src/mas_device]
    label: SIMULATED
    min_tests: 12
    saboteurs:
      - {name: pairing-inside-root, file: src/mas_device/gated.py, old: '    if _inside(record, root):', new: '    if False:'}
      - {name: key-id-unchecked, file: src/mas_device/pairing.py, old: '    if ap.key_id_of(raw["key_pub"]) != raw["key_id"]:', new: '    if False:'}
      - {name: non-canonical-accepted, file: src/mas_device/pairing.py, old: '    if data != record_bytes(raw["key_pub"], raw["medium_id"]):', new: '    if False:'}
      - {name: terms-unlogged, file: src/mas_device/gated.py, old: '    log.append("session.terms_shown", {"sha256": pairing.terms_sha256()})', new: '    pass'}
  - id: P3-REPORT
    phase: 3
    title: The inspection report is readable by the owner and consumable by the agent (schema-checked)
    tests: [device/tests/test_inspect_report.py]
    covers: [src/mas_device]
    label: SIMULATED
  - id: P3-NOCREDS
    phase: 3
    title: Inspection never collects credentials; planted secrets never reach the report or the model context
    tests: [device/tests/test_inspect_nocreds.py]
    covers: [src/mas_device]
    label: SIMULATED
  - id: P4-SECBOOT
    phase: 4
    title: Secure boot and lock design documented (RDP, TrustZone option bytes, key identity) and checked against the firmware's assumptions
    tests: [device/tests/test_secboot_doc.py]
    covers: [device/firmware]
    label: DESIGN-ONLY
    min_tests: 9
    saboteurs:
      - {name: page-size-changed, file: device/firmware/core/mas_hal.h, old: "#define MAS_PAGE_SIZE 8192u", new: "#define MAS_PAGE_SIZE 4096u"}
      - {name: opcode-renumbered, file: device/firmware/core/mas_core.h, old: "#define MAS_OP_SIGN 0x03", new: "#define MAS_OP_SIGN 0x04"}
  - id: P5-ENCLOSURE
    phase: 5
    title: Parametric enclosure fits the board (clearances, USB-C opening, button access) by automatic check
    tests: [device/tests/test_enclosure.py]
    covers: [device/hardware]
    label: DESIGN-ONLY
    min_tests: 16
    saboteurs:
      - {name: plunger-column-unchecked, file: device/hardware/enclosure.py, old: "        if p.get(\"ref\") != \"SW1\" and p[\"z\"][1] > sw[\"z\"][1] and _circle_box(pl[\"at\"], r, p[\"box\"]):", new: "        if False:"}
      - {name: usb-recess-unchecked, file: device/hardware/enclosure.py, old: "    if j1[\"box\"][1] - u[\"face_y\"] > P[\"usb_recess_max\"] + 1e-6:", new: "    if False:"}
  - id: P6-PAPER
    phase: 6
    title: Paper regenerates from raw results (LaTeX source, authors, arXiv variant with methods statement, manual-README baseline, error bars, outside judge, limitations)
    tests: [device/tests/test_paper.py]
    covers: [device/paper, device/evals]
    label: REAL

# Thresholds fixed before any result exists (R-1 M6). A criterion's tests read them from here; changing one stales its PASS.
thresholds:
  P3-INSPECT: {precision_min: 0.95, recall_min: 0.90}
  P6-EVALS: {k_consecutive_runs: 3}
  P4-FW-HOST: {fuzz_frames_min: 10000, differential_scripts_min: 200}
  P2-FLEET: {min_isolated_machines: 2}
