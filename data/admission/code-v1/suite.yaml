  - id: code-07-lru
    title: LRU cache
    prompt: |
      Define a class LRUCache with __init__(self, capacity: int), get(self, key) -> value or -1 when the key is absent, and put(self, key, value) -> None. When a put would exceed the capacity, the least recently used key is evicted. Both get (of a present key) and put count as a use; putting an existing key updates its value.
    grader: {kind: sandbox_tests, n_checks: 7}
    checks: |
      c = LRUCache(2)
      c.put(1, 1)
      c.put(2, 2)
      check(c.get(1), 1)
      c.put(3, 3)
      check(c.get(2), -1)
      c.put(4, 4)
      check(c.get(1), -1)
      check(c.get(3), 3)
      check(c.get(4), 4)
      d = LRUCache(2)
      d.put(1, 1)
      d.put(2, 2)
      d.put(1, 10)
      d.put(3, 3)
      check(d.get(1), 10)
      check(d.get(2), -1)
    reference: |
      from collections import OrderedDict
      class LRUCache:
          def __init__(self, capacity):
              self.cap, self.d = capacity, OrderedDict()
          def get(self, key):
              if key not in self.d:
                  return -1
              self.d.move_to_end(key)
              return self.d[key]
          def put(self, key, value):
              self.d[key] = value
              self.d.move_to_end(key)
              if len(self.d) > self.cap:
                  self.d.popitem(last=False)
    timeout_s: 10
    source: {author: project, license: project license (pending)}
  - id: code-08-dedupe
    title: stable de-duplication
    prompt: |
      Define dedupe(seq, key=None) -> list that returns the items of seq without duplicates, keeping the first occurrence and the original order. When key is given, two items are duplicates when key(item) is equal; key results are hashable. seq may be any iterable, including a string.
    grader: {kind: sandbox_tests, n_checks: 5}
    checks: |
      check(dedupe([3, 1, 3, 2, 1]), [3, 1, 2])
      check(dedupe([]), [])
      check(dedupe(['a', 'A', 'b'], key=str.lower), ['a', 'b'])
      check(dedupe([[1], [1], [2]], key=tuple), [[1], [2]])
      check(dedupe('abca'), ['a', 'b', 'c'])
    reference: |
      def dedupe(seq, key=None):
          seen, out = set(), []
          for x in seq:
              k = key(x) if key else x
              if k not in seen:
                  seen.add(k)
                  out.append(x)
          return out
    timeout_s: 10
    source: {author: project, license: project license (pending)}
