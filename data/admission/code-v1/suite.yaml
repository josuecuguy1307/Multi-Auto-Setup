tasks:
  - id: code-01-roman
    title: roman numerals
    prompt: |
      Define roman_to_int(s: str) -> int that converts a Roman numeral (I V X L C D M, subtractive forms such as IV, IX, XL, XC, CD, CM) in the range 1..3999 to an integer.
    grader: {kind: sandbox_tests, n_checks: 7}
    checks: |
      check(roman_to_int('III'), 3)
      check(roman_to_int('IV'), 4)
      check(roman_to_int('IX'), 9)
      check(roman_to_int('LVIII'), 58)
      check(roman_to_int('XLII'), 42)
      check(roman_to_int('MCMXCIV'), 1994)
      check(roman_to_int('MMMCMXCIX'), 3999)
    reference: |
      def roman_to_int(s):
          v = {'I': 1, 'V': 5, 'X': 10, 'L': 50, 'C': 100, 'D': 500, 'M': 1000}
          t = 0
          for i, c in enumerate(s):
              if i + 1 < len(s) and v[c] < v[s[i + 1]]:
                  t -= v[c]
              else:
                  t += v[c]
          return t
    timeout_s: 10
