  - id: code-10-csv
    title: split a CSV line
    prompt: |
      Define split_csv_line(line: str) -> list[str] that splits one CSV line on commas. A field may be wrapped in double quotes; inside quotes a comma is part of the field and two double quotes in a row mean one literal quote. The wrapping quotes are removed. An empty line gives [''] and consecutive commas give empty fields.
    grader: {kind: sandbox_tests, n_checks: 6}
    checks: |
      check(split_csv_line('a,b,c'), ['a', 'b', 'c'])
      check(split_csv_line('a,"b,c",d'), ['a', 'b,c', 'd'])
      check(split_csv_line('"he said ""hi""",x'), ['he said "hi"', 'x'])
      check(split_csv_line(''), [''])
      check(split_csv_line('a,,b'), ['a', '', 'b'])
      check(split_csv_line(','), ['', ''])
    reference: |
      def split_csv_line(line):
          out, cur, i, q = [], '', 0, False
          while i < len(line):
              c = line[i]
              if q:
                  if c == '"' and line[i + 1:i + 2] == '"':
                      cur += '"'
                      i += 1
                  elif c == '"':
                      q = False
                  else:
                      cur += c
              elif c == '"':
                  q = True
              elif c == ',':
                  out.append(cur)
                  cur = ''
              else:
                  cur += c
              i += 1
          out.append(cur)
          return out
    timeout_s: 10
    source: {author: project, license: project license (pending)}
