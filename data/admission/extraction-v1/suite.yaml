suite_id: extraction-v1
task_type: extraction
version: 1
description: Ten invoice texts in different layouts to one JSON object each. A task passes only when every field equals the expected value.
preamble: ''
est_output_tokens: 80
tasks:
- id: extraction-01-tabular
  title: 'invoice 1: fields as JSON'
  prompt: |
    Invoice text:
    """
    ACME Tools Ltd
    Invoice No: INV-2041
    Date: 14/03/2026
    Subtotal 1,000.00
    VAT 12% 120.00
    Total due 1,120.00 USD
    """
    Reply with only a JSON object with the keys supplier (string), invoice_number (string), date (string, ISO YYYY-MM-DD), total (string with exactly two decimals and no thousands separator) and tax (string, same form).
  grader:
    kind: json
    equals:
      supplier: ACME Tools Ltd
      invoice_number: INV-2041
      date: '2026-03-14'
      total: '1120.00'
      tax: '120.00'
  reference: '{"supplier": "ACME Tools Ltd", "invoice_number": "INV-2041", "date": "2026-03-14", "total": "1120.00", "tax": "120.00"}'
  timeout_s: 120
  source:
    author: project
    license: project license (pending)
